<!DOCTYPE html><html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" /><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" /><meta http-equiv="Pragma" content="no-cache" /><title>Gaming Thumbnail Designer | Ian's Hub</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{gaming:{900:'#0f172a',800:'#1e293b',accent:'#8b5cf6'}}}}}</script></head><body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans overflow-x-hidden transition-colors duration-300"><div id="app" class="min-h-screen flex flex-col md:flex-row"><aside class="w-full md:w-72 bg-slate-100 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-6 flex flex-col gap-8"><div class="flex justify-between items-center"><h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">THUMBNAIL.AI</h1><button id="theme-toggle" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">🌓</button></div><nav class="flex flex-col gap-3"><a href="#" class="p-3 bg-slate-200 dark:bg-slate-800 rounded-lg">Dashboard</a><a href="#" class="p-3 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg">Projects</a><a href="#" class="p-3 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg">Analytics</a></nav><div id="status-badge" class="mt-auto p-4 bg-purple-100 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-500/30 rounded-xl text-sm text-purple-700 dark:text-purple-300">🟢 Operational (Standby Demo)</div></aside><main class="flex-1 p-4 md:p-8"><header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4"><h2 class="text-3xl font-bold">Designer Workspace</h2><div class="bg-slate-100 dark:bg-slate-900 px-4 py-2 rounded-full border border-slate-200 dark:border-slate-700 text-sm">Budget: $250 - $750 USD</div></header><section class="grid grid-cols-1 md:grid-cols-12 gap-6"><div class="md:col-span-8 bg-slate-50 dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800"><h3 class="font-semibold mb-6">Upload Thumbnail Assets</h3><form id="uploadForm" class="space-y-4"><input type="text" placeholder="Project Title" class="w-full p-4 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl" required><div class="border-2 border-dashed border-slate-300 dark:border-slate-700 p-8 text-center rounded-xl hover:border-purple-500 transition-colors cursor-pointer">Drag & Drop Assets (PSD, AI, AE)</div><button type="submit" class="w-full bg-purple-600 text-white p-4 rounded-xl font-bold hover:bg-purple-700 min-h-[44px]">Process Design</button></form></div><div class="md:col-span-4 bg-slate-50 dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800"><h3 class="font-semibold mb-4">Live Activity Log</h3><ul id="log" class="space-y-4 text-sm"></ul></div></section></main></div><script>const logs = ["Asset #8821 uploaded by Designer", "Rendering animation sequence...", "Thumbnail score updated: 94/100", "System health check: All systems nominal"];const logEl = document.getElementById('log');logs.forEach(l => {const li = document.createElement('li');li.className = 'border-l-2 border-purple-500 pl-4 py-1 text-slate-600 dark:text-slate-400';li.textContent = l;logEl.appendChild(li);});document.getElementById('theme-toggle').addEventListener('click', () => {document.documentElement.classList.toggle('dark');});document.getElementById('uploadForm').addEventListener('submit', (e) => {e.preventDefault();alert('Assets submitted for processing!');});</script></body></html>
