<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" /><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" /><meta http-equiv="Pragma" content="no-cache" /><title>CarpetOps | Operations Manager</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{slate:{850:'#1e293b'},teal:{500:'#14b8a6'}}}}}</script></head><body class="bg-slate-50 text-slate-900 font-sans overflow-x-hidden"><div id="app" class="min-h-screen flex flex-col md:flex-row"><aside class="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col gap-6"><h1 class="text-xl font-bold text-teal-400">CarpetOps Manager</h1><nav class="flex flex-col gap-2"><a href="#" class="p-2 hover:bg-slate-800 rounded">Dashboard</a><a href="#" class="p-2 hover:bg-slate-800 rounded">Pickups</a><a href="#" class="p-2 hover:bg-slate-800 rounded">Analytics</a></nav><div id="status-badge" class="mt-auto p-3 bg-teal-900/30 border border-teal-500/50 rounded text-sm text-teal-400">🟢 Operational (Standby Demo)</div></aside><main class="flex-1 p-4 md:p-8"><header class="mb-8"><h2 class="text-2xl font-bold">Operations Dashboard</h2></header><section class="grid grid-cols-1 md:grid-cols-12 gap-6"><div class="md:col-span-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200"><h3 class="font-semibold mb-4">New Pickup Request</h3><form id="pickupForm" class="grid grid-cols-1 md:grid-cols-2 gap-4"><input type="text" placeholder="Customer Name" class="p-3 border rounded w-full" required><input type="tel" placeholder="Contact Phone" class="p-3 border rounded w-full" required><input type="text" placeholder="Pickup Address" class="p-3 border rounded w-full col-span-full" required><textarea placeholder="Carpet Specifications" class="p-3 border rounded w-full col-span-full"></textarea><button type="submit" class="bg-teal-600 text-white p-3 rounded font-bold hover:bg-teal-700 min-h-[44px]">Submit Request</button></form></div><div class="md:col-span-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200"><h3 class="font-semibold mb-4">Activity Log</h3><ul id="log" class="space-y-3 text-sm"></ul></div></section></main></div><script>const logs = ["Pickup #1024 assigned to Driver A", "Customer feedback received for #1022", "Route optimization complete for Zone 4", "System health check: All systems nominal"];const logEl = document.getElementById('log');logs.forEach(l => {const li = document.createElement('li');li.className = 'border-l-2 border-teal-500 pl-3 py-1';li.textContent = l;logEl.appendChild(li);});document.getElementById('pickupForm').addEventListener('submit', (e) => {e.preventDefault();alert('Pickup request submitted successfully!');});</script></body></html>
